name: Restaurant Company - CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: restaurant-company

jobs:

  # ==========================================================
  # JOB 1 - LINT
  # Runs in parallel with SonarQube and Trivy
  # ==========================================================
  lint:
    name: "1. Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint


  # ==========================================================
  # JOB 2 - SONARQUBE
  # Runs in parallel with Lint and Trivy
  # ==========================================================
  sonarqube:
    name: "2. SonarQube"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ==========================================================
  # JOB 3 - TRIVY
  # Runs in parallel with Lint and SonarQube
  # ==========================================================
  trivy:
    name: "3. Trivy Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true


  # ==========================================================
  # JOB 4 - BUILD AND PUSH IMAGE
  #
  # IMPORTANT:
  # This job does NOT start immediately.
  # It waits for all 3 parallel jobs above.
  # ==========================================================
  build-and-push:
    name: "4. Docker Build & Push to ECR"
    runs-on: ubuntu-latest

    needs:
      - lint
      - sonarqube
      - trivy

    # Don't push images from pull requests
    if: github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create Image Tag
        id: image
        run: |
          IMAGE_TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Docker image tag: $IMAGE_TAG"

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Show Published Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "========================================"
          echo "CI PIPELINE PASSED"
          echo "========================================"
          echo "Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Commit:"
          echo "$GITHUB_SHA"
          echo "========================================"
