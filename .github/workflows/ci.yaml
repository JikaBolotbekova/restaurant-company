name: Restaurant Company - Parallel CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
#              PARALLEL CI PIPELINE
#
#                    CODE PUSH
#                        |
#        +---------------+---------------+
#        |               |               |
#        v               v               v
#      LINT          SONARQUBE         TRIVY
#        |               |               |
#        +---------------+---------------+
#                        |
#                 BUILD APP (also parallel)
#                        |
#        All 4 jobs must complete successfully
#                        |
#                        v
#                  DOCKER BUILD
#                        |
#                        v
#                 TRIVY IMAGE SCAN
#                        |
#                        v
#                 TEST CONTAINER
#                        |
#                        v
#                    SUCCESS
#
# IMPORTANT:
# lint, sonarqube, trivy, and build DO NOT have "needs:"
# Therefore GitHub Actions can run them IN PARALLEL.
#
# Docker HAS "needs:", so it waits.
# ============================================================


jobs:

  # ==========================================================
  # PARALLEL JOB #1
  # LINT
  # ==========================================================
  lint:
    name: "1️⃣ LINT - Parallel"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Lint Finished
        run: |
          echo "================================="
          echo "LINT JOB FINISHED"
          echo "================================="


  # ==========================================================
  # PARALLEL JOB #2
  # SONARQUBE
  # ==========================================================
  sonarqube:
    name: "2️⃣ SONARQUBE - Parallel"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # SonarQube benefits from complete Git history
          fetch-depth: 0

      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Finished
        run: |
          echo "================================="
          echo "SONARQUBE JOB FINISHED"
          echo "================================="


  # ==========================================================
  # PARALLEL JOB #3
  # TRIVY FILESYSTEM SCAN
  #
  # Scans repository/dependencies BEFORE Docker image exists.
  # ==========================================================
  trivy:
    name: "3️⃣ TRIVY SOURCE SCAN - Parallel"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH

          # For classroom demonstration:
          # don't fail pipeline because of vulnerabilities.
          exit-code: 0

      - name: Trivy Finished
        run: |
          echo "================================="
          echo "TRIVY SOURCE SCAN FINISHED"
          echo "================================="


  # ==========================================================
  # PARALLEL JOB #4
  # BUILD REACT/VITE APPLICATION
  # ==========================================================
  build:
    name: "4️⃣ BUILD - Parallel"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

          # ===============================================
          # CACHING
          # GitHub can reuse npm's downloaded packages.
          # ===============================================
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build

      - name: Verify dist Directory
        run: |
          echo "Build output:"
          ls -lah dist/

      - name: Build Finished
        run: |
          echo "================================="
          echo "APPLICATION BUILD FINISHED"
          echo "================================="


  # ==========================================================
  # SEQUENTIAL JOB
  #
  # THIS JOB DOES NOT START IMMEDIATELY.
  #
  # "needs" means:
  #
  # WAIT FOR:
  #   lint
  #   sonarqube
  #   trivy
  #   build
  #
  # ==========================================================
  docker:
    name: "5️⃣ DOCKER - Waits for Parallel Jobs"

    runs-on: ubuntu-latest

    needs:
      - lint
      - sonarqube
      - trivy
      - build

    steps:

      - name: Explain Dependency
        run: |
          echo "=============================================="
          echo "ALL FOUR PARALLEL JOBS PASSED!"
          echo ""
          echo "✓ Lint"
          echo "✓ SonarQube"
          echo "✓ Trivy Source Scan"
          echo "✓ Application Build"
          echo ""
          echo "Docker job can now start."
          echo "=============================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      # ======================================================
      # BUILD DOCKER IMAGE
      # ======================================================

      - name: Build Docker Image
        run: |
          docker build \
            -t restaurant-company:${{ github.sha }} .

      - name: Show Docker Image
        run: |
          docker images restaurant-company


      # ======================================================
      # TRIVY SCAN #2
      #
      # Earlier:
      # Trivy scanned SOURCE FILES.
      #
      # Now:
      # Trivy scans the actual CONTAINER IMAGE.
      # ======================================================

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: restaurant-company:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0


      # ======================================================
      # RUN CONTAINER
      # ======================================================

      - name: Start Restaurant Container
        run: |
          docker run -d \
            --name restaurant-company \
            -p 8080:80 \
            restaurant-company:${{ github.sha }}


      # ======================================================
      # WAIT FOR APPLICATION
      # ======================================================

      - name: Wait for Application
        run: sleep 5


      # ======================================================
      # SHOW CONTAINER
      # ======================================================

      - name: Check Container
        run: |
          docker ps


      # ======================================================
      # SMOKE TEST
      # ======================================================

      - name: Smoke Test
        run: |
          curl --fail http://localhost:8080/


  # ==========================================================
  # FINAL JOB
  #
  # Only starts when Docker succeeds.
  # ==========================================================
  final:
    name: "6️⃣ CI PIPELINE PASSED"

    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Pipeline Summary
        run: |
          echo ""
          echo "=============================================="
          echo "     RESTAURANT COMPANY CI SUCCESS"
          echo "=============================================="
          echo ""
          echo "PARALLEL:"
          echo "  ✓ Lint"
          echo "  ✓ SonarQube"
          echo "  ✓ Trivy Source Scan"
          echo "  ✓ Application Build"
          echo ""
          echo "AFTER PARALLEL JOBS:"
          echo "  ✓ Docker Build"
          echo "  ✓ Trivy Image Scan"
          echo "  ✓ Container Started"
          echo "  ✓ Smoke Test"
          echo ""
          echo "=============================================="
